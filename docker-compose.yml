# Sobe um PostgreSQL 16 local usando as variáveis do arquivo .env da raiz.
# Na primeira inicialização, schema.sql e carga.sql são executados automaticamente
# (ordem alfabética dos arquivos montados em /docker-entrypoint-initdb.d).
services:
  postgres:
    image: postgres:16-alpine
    container_name: cruel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/carga.sql:/docker-entrypoint-initdb.d/02_carga.sql:ro
      - ./database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
