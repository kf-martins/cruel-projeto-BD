spring.application.name=crUEL

# Carrega o .env da raiz do repositório (executando a partir de backend/ ou da raiz).
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# DataSource JDBC (HikariCP) — credenciais vindas do .env
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:avaliacao_docente_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# O esquema é criado pelos scripts em database/ (schema.sql + carga.sql), não pela aplicação.
spring.sql.init.mode=never

# Origens liberadas para o front-end (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.br.uel.avaliacao=INFO
